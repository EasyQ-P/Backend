# EasyQ service — LOCAL DEVELOPMENT stack (repository root).
#
#   docker compose up --build        # first time (builds images with dependencies only)
#   docker compose up                # afterwards; code changes reload automatically (bind mounts)
#   docker compose down -v           # wipe the database and start clean
#
# Images contain dependencies; each container bind-mounts its own source folder plus common/:
#   auth    → ./auth + ./common     (uvicorn --reload)          http://localhost:8001/docs
#   backend → ./backend + ./common  (uvicorn --reload)          http://localhost:8000/docs
#   worker  → ./worker + ./common   (restarts on file change)
# Browser entry is Caddy on http://localhost:8080 (= PUBLIC_ORIGIN): /api/v1 → auth/backend, everything else →
# the Next.js dev server on the host (:3000). Mail goes to Mailpit (http://localhost:8025), never out.
# All keys and passwords here are fixed development values for this local stack only.
name: easyq

x-env: &env
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  COOKIE_SECURE: "false"
  CODE_HMAC_KEY: dev-only-hmac-key-0123456789abcdefghijklmnop
  DELIVERY_ENCRYPTION_KEY: AL7SaFMzn73pcQ4h3qzQxLXq3DB0-ITDKallWqy6SvU=
  INTERNAL_SERVICE_KEY: dev-only-internal-key-0123456789abcdefghij
  WORKER_SERVICE_KEY: dev-only-worker-key-0123456789abcdefghijklm
  AUTH_BASE_URL: http://auth:8000
  STORAGE_BACKEND: local
  OBJECT_ROOT: /app/var/objects
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: no-reply@example.com    # not .local/.test: fastapi-mail rejects special-use domains
  SMTP_STARTTLS: "false"
  SMTP_SSL_TLS: "false"
  FORWARDED_ALLOW_IPS: "*"             # only Caddy and the host reach these ports
  WATCHFILES_FORCE_POLLING: "true"     # bind mounts on Windows/macOS do not deliver file events
  # Optional real providers: put them in a .env file next to this compose.yaml.
  EMBEDDING_URL: ${EMBEDDING_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  STT_MODEL: ${STT_MODEL:-}
  STT_API_KEY: ${STT_API_KEY:-}
  # Claude (QA answers, LLM_ONLY judgment, summary notes). Without a key questions escalate with PROVIDER_FAILURE;
  # without prices + price version LLM calls are held while the budget hard cap is on (same rule as embeddings).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-llm-only-v1}
  LLM_ONLY_THRESHOLD: ${LLM_ONLY_THRESHOLD:-70}
  LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-}
  LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-}
  LLM_PRICE_VERSION: ${LLM_PRICE_VERSION:-}
  EMBEDDING_MAX_BATCH_COST_USD: ${EMBEDDING_MAX_BATCH_COST_USD:-}
  EMBEDDING_PRICE_VERSION: ${EMBEDDING_PRICE_VERSION:-}
  CHUNK_TOKENIZER: ${CHUNK_TOKENIZER:-BAAI/bge-reranker-v2-m3}
  TRAINING_API_BASE_URL: ${TRAINING_API_BASE_URL:-http://trainer-mock:9000/api/v1}
  TRAINING_API_KEY: ${TRAINING_API_KEY:-dev-only-trainer-key}

x-auth-build: &auth-build
  context: .
  dockerfile: auth/Dockerfile

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: easyq
      POSTGRES_USER: easyq_owner
      POSTGRES_PASSWORD: easyq_owner_dev
    ports: ["127.0.0.1:${DB_PORT:-15432}:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Run once, in file-name order, on an empty volume (docker compose down -v to run them again).
      # v1.4: the schema file already contains auth_session_view (csrf_token_hash, session_created_at).
      - "./DB 스키마파일/easyq_schema_v1.4.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"
      - ./dev/db-init/03_dev_roles.sql:/docker-entrypoint-initdb.d/02_dev_roles.sql:ro
      - ./migrations/002_runtime_grants.sql:/docker-entrypoint-initdb.d/03_runtime_grants.sql:ro
    healthcheck:
      # Over TCP: the entrypoint's temporary init server listens only on the socket, so this passes only after
      # every init script ran; the role check confirms 02/03 finished.
      test: ["CMD-SHELL", "PGPASSWORD=easyq_owner_dev psql -h 127.0.0.1 -U easyq_owner -d easyq -tAc \"SELECT 1 FROM pg_roles WHERE rolname='easyq_worker'\" | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]

  auth:
    build: *auth-build
    image: easyq-auth:dev
    command: [uvicorn, --factory, easyq_auth.main:create_app, --host, 0.0.0.0, --port, "8000",
              --reload, --reload-dir, /app/common, --reload-dir, /app/auth]
    environment:
      <<: *env
      DATABASE_URL: postgresql://easyq_auth:easyq_auth_dev@db:5432/easyq
      # Provider keys belong to backend/worker only (CLAUDE.md: X-API-Key is never given to auth).
      TRAINING_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      EMBEDDING_API_KEY: ""
      STT_API_KEY: ""
    volumes: [./common:/app/common, ./auth:/app/auth]
    ports: ["127.0.0.1:${AUTH_PORT:-8001}:8000"]
    depends_on: {db: {condition: service_healthy}}

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    image: easyq-backend:dev
    command: [uvicorn, --factory, easyq_backend.main:create_app, --host, 0.0.0.0, --port, "8000",
              --reload, --reload-dir, /app/common, --reload-dir, /app/backend]
    environment:
      <<: *env
      DATABASE_URL: postgresql://easyq_backend:easyq_backend_dev@db:5432/easyq
    volumes: [./common:/app/common, ./backend:/app/backend, objects:/app/var/objects]
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on: {db: {condition: service_healthy}, auth: {condition: service_started}}

  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    image: easyq-worker:dev
    # watchfiles (installed with uvicorn[standard]) restarts the worker when its code changes.
    command: [watchfiles, --filter, python, "python -m easyq_worker.main", /app/common, /app/worker]
    environment:
      <<: *env
      DATABASE_URL: postgresql://easyq_worker:easyq_worker_dev@db:5432/easyq
      INTERNAL_SERVICE_KEY: dev-only-worker-key-0123456789abcdefghijklm   # worker may only call INT-02
    # hfcache keeps the chunk tokenizer (CHUNK_TOKENIZER, downloaded on the first INGEST) across restarts.
    volumes: [./common:/app/common, ./worker:/app/worker, objects:/app/var/objects, hfcache:/home/easyq/.cache]
    depends_on: {db: {condition: service_healthy}, mailpit: {condition: service_started}}

  # One-off: test accounts member@easyq.local / easyq2026 and admin@easyq.local / admin2026 (kept if they exist).
  seed:
    build: *auth-build
    image: easyq-auth:dev
    command: [python, -m, easyq_auth.devseed]
    environment:
      <<: *env
      DATABASE_URL: postgresql://easyq_auth:easyq_auth_dev@db:5432/easyq
      EASYQ_DEV_SEED: "1"
      TRAINING_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      EMBEDDING_API_KEY: ""
      STT_API_KEY: ""
    volumes: [./common:/app/common, ./auth:/app/auth]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  # Training-server mock (7.4.1 health, 7.4.26 judgments) for v0.4 work; reuses the auth image (FastAPI + uvicorn).
  trainer-mock:
    build: *auth-build
    image: easyq-auth:dev
    command: [uvicorn, main:app, --app-dir, /mock, --host, 0.0.0.0, --port, "9000"]
    environment:
      TRAINER_API_KEY: ${TRAINING_API_KEY:-dev-only-trainer-key}
      TRAINER_MODE: ${TRAINER_MODE:-CUSTOM}
      TRAINER_THRESHOLD: ${TRAINER_THRESHOLD:-0.35}
      TRAINER_DELAY_MS: ${TRAINER_DELAY_MS:-0}
    volumes: [./dev/trainer-mock:/mock:ro]

  caddy:
    image: caddy:2
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes: [./dev/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach the Next.js dev server on the host (Linux too)
    depends_on: [auth, backend]

volumes:
  dbdata:
  objects:
  hfcache:
