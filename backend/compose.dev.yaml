# LOCAL DEVELOPMENT stack for frontend integration (not for deployment).
#   cd backend
#   docker compose -f compose.dev.yaml up --build
# Brings up PostgreSQL 16 + pgvector (schema applied on first start), Mailpit (catches all mail),
# auth (:8001), backend (:8000), worker, and creates the test accounts once (seed).
# All keys and passwords below are fixed development values, valid only for this local stack.
# Reset the database: docker compose -f compose.dev.yaml down -v
x-app-env: &app-env
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}   # the Next.js dev server (proxying /api/v1)
  COOKIE_SECURE: "false"                                    # http://localhost has no TLS
  CODE_HMAC_KEY: dev-only-hmac-key-0123456789abcdefghijklmnop
  DELIVERY_ENCRYPTION_KEY: AL7SaFMzn73pcQ4h3qzQxLXq3DB0-ITDKallWqy6SvU=
  INTERNAL_SERVICE_KEY: dev-only-internal-key-0123456789abcdefghij
  WORKER_SERVICE_KEY: dev-only-worker-key-0123456789abcdefghijklm
  AUTH_BASE_URL: http://auth:8000
  STORAGE_BACKEND: local
  OBJECT_ROOT: /app/var/objects
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: no-reply@easyq.local
  SMTP_STARTTLS: "false"
  SMTP_SSL_TLS: "false"
  # Optional real providers (otherwise document indexing fails with INDEX_BUILD_FAILED and audio.start with STT_UNAVAILABLE).
  EMBEDDING_URL: ${EMBEDDING_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  STT_MODEL: ${STT_MODEL:-}
  STT_API_KEY: ${STT_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: easyq
      POSTGRES_USER: easyq_owner
      POSTGRES_PASSWORD: easyq_owner_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Run once on an empty volume, in file-name order.
      - "../DB 스키마파일/easyq_schema_v1.2.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"
      - ./migrations/001_auth_session_view.sql:/docker-entrypoint-initdb.d/02_auth_session_view.sql:ro
      - ./dev/db-init/03_dev_roles.sql:/docker-entrypoint-initdb.d/03_dev_roles.sql:ro
      - ./migrations/002_runtime_grants.example.sql:/docker-entrypoint-initdb.d/04_runtime_grants.sql:ro
    healthcheck:
      # TCP (-h 127.0.0.1): the entrypoint's temporary init server listens only on the socket, so this
      # passes only after every init script ran; the role check confirms 03/04 finished.
      test: ["CMD-SHELL", "PGPASSWORD=easyq_owner_dev psql -h 127.0.0.1 -U easyq_owner -d easyq -tAc \"SELECT 1 FROM pg_roles WHERE rolname='easyq_worker'\" | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]   # web UI: verification codes and reset links show up here

  seed:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [python, -m, easyq.devseed]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://easyq_auth:easyq_auth_dev@db:5432/easyq
      EASYQ_DEV_SEED: "1"
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  auth:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [uvicorn, easyq.auth_app:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://easyq_auth:easyq_auth_dev@db:5432/easyq
    ports: ["127.0.0.1:8001:8000"]
    depends_on: {db: {condition: service_healthy}}

  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [uvicorn, easyq.backend_app:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://easyq_backend:easyq_backend_dev@db:5432/easyq
    ports: ["127.0.0.1:8000:8000"]
    volumes: [objects:/app/var/objects]
    depends_on: {db: {condition: service_healthy}, auth: {condition: service_started}}

  worker:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [python, -m, easyq.worker]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://easyq_worker:easyq_worker_dev@db:5432/easyq
      INTERNAL_SERVICE_KEY: dev-only-worker-key-0123456789abcdefghijklm
    volumes: [objects:/app/var/objects]
    depends_on: {db: {condition: service_healthy}}

volumes:
  dbdata:
  objects:
